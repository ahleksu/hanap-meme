# Copy to sources.yaml (gitignored) and edit. `npm run ingest` uses sources.yaml if it exists,
# otherwise this file.

# Shown in the bot User-Agent: "HanapMemeBot/0.1 (+<contact_url>)". Point it at your fork.
contact_url: https://github.com/ahleksu/hanap-meme

# a) Local folder. Drop images here. An optional sidecar <name>.json next to <name>.png can set
#    source_url, source_platform, original_author, rights_status ("own" or "unverified"),
#    description_tl, description_en, ocr_text, tags_emotion, tags_situation, format, language,
#    approve (same rule as approve under urls below), and maintainer notes:
#    subjects (who or what is in it, e.g. ["Vice Ganda", "It's Showtime"]) and context (why it is known).
inbox:
  enabled: true
  dir: data/inbox

# Our own AI-generated templates in public/templates/ (from `npm run templates`).
templates:
  enabled: true

# GIPHY search API. Needs GIPHY_API_KEY in .env.local (free at developers.giphy.com).
# GIFs stay animated. Each one credits the GIPHY page and uploader. Skipped with no OpenAI key.
giphy:
  enabled: true
  rating: pg
  per_query: 10
  queries: [pinoy, filipino, tagalog, pinoy funny, philippines]

# c) Imgflip public templates API (https://api.imgflip.com/get_memes).
imgflip:
  enabled: true
  max: 40

# Direct image or GIF links. A plain string, or {url, source_url, platform, author, approve} to credit the post page.
# approve: true lets the maintainer show a link that the AI review flagged as possible_minor or
# private_individual. It never overrides explicit or hateful, and it never restores a takedown.
# subjects and context are maintainer notes. They make a meme searchable by name, for example:
#   - url: https://media.tenor.com/<id>/example.gif
#     subjects: ["Malupiton"]
#     context: Pinoy vlogger known for the "boss" catchphrase
# robots.txt is checked for each link. Hosts that block bots (for example i.pinimg.com) are skipped:
# save those images into data/inbox/ yourself with a sidecar .json instead.
urls: []

# b) Public pages to scrape. robots.txt is obeyed, max 1 request / 2s per host.
#    Each image keeps the page URL as its source_url. Scraped images are only stored after an
#    AI safety review, so this source is skipped when OPENAI_API_KEY is not set.
